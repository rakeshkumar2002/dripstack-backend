name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dripstack
          POSTGRES_PASSWORD: dripstack
          POSTGRES_DB: dripstack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dripstack"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: dripstack
          RABBITMQ_DEFAULT_PASS: dripstack
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dripstack:dripstack@localhost:5432/dripstack
      RABBITMQ_URL: amqp://dripstack:dripstack@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --all-extras
      # The image builds with --frozen --all-extras; a drifted lock fails there
      # and nowhere else, so catch it here.
      - name: Lockfile is current
        run: uv lock --check
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Seed
        run: uv run seed
      - name: Tests (pytest)
        run: uv run pytest -q

  image:
    name: Build + push arm64 image
    # arm64 native, NOT ubuntu-latest: the deploy target is a t4g.small
    # (Graviton). An amd64 image pushed here fails on the box with a bare
    # "exec format error" at container start and nowhere earlier.
    runs-on: ubuntu-24.04-arm
    needs: test
    permissions:
      contents: read
      id-token: write        # OIDC — no AWS keys stored in the repo
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: ECR login
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.ECR_REGISTRY }}/dripstack-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # uv installs the project editable via a .pth holding an absolute path, so
      # a builder/runtime WORKDIR mismatch only fails at container start. Catch
      # it at PR time instead of at deploy time.
      - name: Smoke — entrypoints resolve
        if: github.event_name == 'pull_request'
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$IMG" python -c "import dripstack.api.main, dripstack.worker.main"
          docker run --rm "$IMG" alembic --help > /dev/null

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    # Serialise this repo's deploys. The dashboard repo has its own group, so
    # box-deploy.sh also takes a flock for the cross-repo case.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    steps:
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      # SSM Run Command, not SSH: the box's security group admits a single home
      # IP, and hosted runners have no stable egress address to allow-list.
      # Nothing inbound is opened; the agent polls SSM outbound.
      - name: Deploy via SSM
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # Deploy the immutable sha tag, never :latest — this is the only way
          # to know afterwards which build is actually serving traffic.
          # Must match docker/metadata-action's type=sha,format=long output.
          TAG="sha-${{ github.sha }}"
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "backend ${GITHUB_SHA::7}" \
            --parameters "commands=[\"bash /home/ec2-user/box-deploy.sh backend $TAG\"]" \
            --query 'Command.CommandId' --output text)
          echo "ssm command: $CMD"
          # NOT `aws ssm wait command-executed`: that waiter gives up after
          # ~100s, while box-deploy.sh allows 150s for /ready alone — it would
          # report failure on a deploy that was still healthy and in progress.
          for _ in $(seq 1 72); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
            --query 'StandardOutputContent' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::deploy failed ($STATUS)"
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
