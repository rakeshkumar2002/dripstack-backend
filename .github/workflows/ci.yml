name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dripstack
          POSTGRES_PASSWORD: dripstack
          POSTGRES_DB: dripstack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dripstack"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: dripstack
          RABBITMQ_DEFAULT_PASS: dripstack
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dripstack:dripstack@localhost:5432/dripstack
      RABBITMQ_URL: amqp://dripstack:dripstack@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --all-extras
      # The image builds with --frozen --all-extras; a drifted lock fails there
      # and nowhere else, so catch it here.
      - name: Lockfile is current
        run: uv lock --check
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Seed
        run: uv run seed
      - name: Tests (pytest)
        run: uv run pytest -q

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # uv installs the project editable via a .pth holding an absolute path, so
      # a builder/runtime WORKDIR mismatch only fails at container start. Catch
      # it at PR time instead of at deploy time.
      - name: Smoke — entrypoints resolve
        if: github.event_name == 'pull_request'
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$IMG" python -c "import dripstack.api.main, dripstack.worker.main"
          docker run --rm "$IMG" alembic --help > /dev/null
