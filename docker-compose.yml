# DripStack local infrastructure (Postgres + RabbitMQ + Temporal dev server).
#
# Start infra:   docker compose up -d
# Then:          cd backend && uv sync && alembic upgrade head && uv run seed
#                uv run api   (one shell)   +   uv run worker   (another)
#
# Running the app processes (api/worker) on the host keeps the demo fast and
# hot-reloadable. Temporal Web UI: http://localhost:8233 · RabbitMQ UI: :15672
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dripstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dripstack}
      POSTGRES_DB: ${POSTGRES_DB:-dripstack}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dripstack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RabbitMQ (AMQP broker) — buffers ingest + drives outbound-webhook retries
  # via a dead-letter exchange. Management UI on :15672 (guest creds below).
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dripstack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dripstack}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Temporal dev server (in-memory + SQLite). Single binary, perfect for local MVP.
  temporal:
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.1
    restart: unless-stopped
    # This image's ENTRYPOINT hardcodes `sleep infinity`; override it so the
    # bundled `temporal` CLI actually runs the dev server.
    entrypoint: ["tini", "--"]
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0", "--namespace", "default"]
    ports:
      - "7233:7233" # gRPC frontend
      - "8233:8233" # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
